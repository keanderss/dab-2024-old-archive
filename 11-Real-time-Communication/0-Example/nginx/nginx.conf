worker_processes 1;

events {
  worker_connections 1024;
}

http {

  upstream todo-api {
    server todo-api:7777;
  }

  upstream sse-api {
    server sse-api:7778;
  }

  upstream ws-api {
    server ws-api:7779;
  }

  upstream todo-ui {
    server todo-ui:3000;
  }

  server {
    listen 7800;

    location /api/ {
      proxy_pass http://todo-api/;
    }

    location /api/json-sse {
      proxy_pass http://sse-api/;
      # https://stackoverflow.com/questions/13672743/eventsource-server-sent-events-through-nginx
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      chunked_transfer_encoding off;
    }

    location /api/json-ws {
      proxy_pass http://ws-api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
    }

    location / {
      proxy_pass http://todo-ui;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;  
    }
  }
}